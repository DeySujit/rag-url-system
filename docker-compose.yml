services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USERNAME_LOCAL:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD_LOCAL:-postgres}
      POSTGRES_DB: ${DB_NAME_LOCAL:-rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_pgvector.sql:/docker-entrypoint-initdb.d/001_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME_LOCAL:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST_LOCAL: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: .
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=4
    env_file: .env
    environment:
      DB_HOST_LOCAL: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
