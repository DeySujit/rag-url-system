[project]
name = "rag-url-system"
version = "1.0.0"
description = "Production web-content ingestion pipeline for RAG (crawl -> chunk -> embed -> vector store)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
